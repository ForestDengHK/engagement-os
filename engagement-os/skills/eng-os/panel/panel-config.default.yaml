# panel-config.default.yaml
# Shipped with the panel-framework plugin. When /panel-init runs in a new
# project, this file is copied to .claude/panel-config.yaml and then edited
# to match the project. Do not edit this file in a target project — edit
# the project-local copy.

# ──────────────────────────────────────────────────────────────────
# Language and output
# ──────────────────────────────────────────────────────────────────

output_language: en-US          # v2: English only
output_base: panel/             # relative to repo root

output_paths:
  discussions: panel/discussions/
  drafts: panel/drafts/
  reviews: panel/reviews/
  debriefs: panel/debriefs/
  refresh: panel/refresh/

log_enabled: true

# ──────────────────────────────────────────────────────────────────
# Mode B convergence (Mode A is dropped in v2)
# ──────────────────────────────────────────────────────────────────

mode_b_convergence: true         # round 2 cross-influence by default
mode_b_role_limit: 6             # warn if more roles dispatched in one panel

# ──────────────────────────────────────────────────────────────────
# Draft-specific behavior
# ──────────────────────────────────────────────────────────────────
#
# Auto-review is opt-in per invocation via `--with-review=<roles>` on
# /panel-draft. There is no config flag for auto-review because it requires an
# explicit reviewer role list, which must come from the invocation, not a
# default. `review_focus` below is used only when `--with-review` is present.

panel_draft:
  review_focus: all              # quality | completeness | risk | compliance | all

# ──────────────────────────────────────────────────────────────────
# Recon phase (Step 3 of the 5-phase pipeline)
# ──────────────────────────────────────────────────────────────────

recon:
  enabled: true
  confirm_with_user: true        # set false for non-interactive / CI runs

  # File formats considered for Recon Index
  file_globs:
    - "**/*.md"
    - "**/*.txt"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/*.csv"
    - "**/*.pdf"
    - "**/*.xlsx"
    - "**/*.docx"
    - "**/*.pptx"

  # Paths and formats excluded from Recon
  exclusions:
    - ".git/"
    - "node_modules/"
    - ".claude/"
    - "panel/"                   # output base — prevent echo chamber
    - "panel/_recon_cache/"      # binary conversion cache
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.gif"
    - "**/*.svg"
    - "**/*.zip"
    - "**/*.tar"
    - "**/*.gz"
    - "**/*.exe"
    - "**/*.bin"

  small_file_threshold_tokens: 3000   # below this: bundle full text; above: excerpts
  max_bundle_tokens: 30000            # total bundle size cap
  max_single_file_bytes: 500000       # files above this trigger F4 prompt
  oversized_default: prompt           # prompt | skip | head
  keyword_expansion: true             # allow LLM synonym expansion at Recon time

# ──────────────────────────────────────────────────────────────────
# Binary format handling (Plan 2 integrates the conversion skills)
# ──────────────────────────────────────────────────────────────────

binary_handling:
  auto_convert: false                 # Plan 1: binaries surfaced but not converted
  require_user_approval: true         # per-file or per-thread approval
  conversion_skills:
    pdf: native-read                  # Read tool handles PDFs natively
    xlsx: xlsx                        # invoke via Skill tool (Plan 2)
    docx: docx                        # Plan 2
    pptx: pptx                        # Plan 2
  cache_path: panel/_recon_cache/<thread_id>/
  gitignore_cache: true

# ──────────────────────────────────────────────────────────────────
# Failure policies (see spec §8 and Appendix A)
# ──────────────────────────────────────────────────────────────────

failure_policy:
  grep_truncated: prompt              # prompt | proceed | abort
  zero_matches: prompt                # prompt | proceed-no-recon | abort
  read_failure: continue              # continue | abort
  mcp_failure: fallback-web           # fallback-web | fail | retry
  web_failure: mark-stale             # mark-stale | fail | retry-once
  convert_failure: skip               # skip | abort
